name: SprintMart CI

# Fallback/companion to the Jenkinsfile: this runs automatically the moment
# you push to GitHub, with zero infrastructure to set up. Use it to keep
# training moving while Jenkins is being configured, or alongside Jenkins
# permanently - they run the exact same test suite.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run automated tests
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
